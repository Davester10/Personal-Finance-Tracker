<!DOCTYPE html>
<html lang="en" class="antialiased">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFinance – Track. Plan. Grow.</title>
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' },
          },
          fontFamily: { sans: ['sf-pro', 'Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body
  class="bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 mx-auto rounded-2xl bg-white/10 backdrop-blur border border-white/20 flex items-center justify-center text-3xl font-bold text-white mb-4 shadow-xl">
        ₦</div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">MyFinance</h1>
      <p class="text-primary-200 text-sm mt-1">Track. Plan. Grow.</p>
    </div>

    <!-- Card -->
    <div class="bg-white/95 backdrop-blur rounded-3xl shadow-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b border-slate-100">
        <button id="tab-signin"
          class="flex-1 py-3.5 text-sm font-semibold text-primary-700 border-b-2 border-primary-600 bg-primary-50/50 transition-colors">Sign
          In</button>
        <button id="tab-register"
          class="flex-1 py-3.5 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors">Register</button>
      </div>

      <!-- Sign In Panel -->
      <div id="panel-signin" class="p-6 space-y-4">
        <div id="signin-warning"
          class="hidden items-center gap-2 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2.5">
          <i class="fa-solid fa-triangle-exclamation"></i> <span></span>
        </div>
        <label class="block text-sm font-medium text-slate-700">Email
          <input type="email" id="si-email"
            class="mt-1 w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
            placeholder="you@example.com" />
        </label>
        <label class="block text-sm font-medium text-slate-700">Password
          <div class="relative mt-1">
            <input type="password" id="si-pass"
              class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
              placeholder="••••••" />
            <button type="button"
              class="pass-toggle absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
              data-target="si-pass"><i class="fa-solid fa-eye"></i></button>
          </div>
        </label>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" id="remember-me"
              class="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
            Remember me
          </label>
          <a href="#" id="forgot-link" class="text-sm font-medium text-primary-600 hover:text-primary-700">Forgot
            password?</a>
        </div>
        <button id="btn-signin"
          class="w-full py-3 rounded-xl bg-primary-600 text-white font-semibold hover:bg-primary-700 transition-all shadow-lg shadow-primary-500/25 active:scale-[0.98]">Sign
          In</button>
        <div class="relative py-2">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-slate-400">or</span></div>
        </div>
        <button id="btn-google"
          class="w-full py-3 rounded-xl border border-slate-200 bg-white text-slate-700 font-medium hover:bg-slate-50 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Register Panel -->
      <div id="panel-register" class="hidden p-6 space-y-4">
        <div id="register-warning"
          class="hidden items-center gap-2 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2.5">
          <i class="fa-solid fa-triangle-exclamation"></i> <span></span>
        </div>
        <label class="block text-sm font-medium text-slate-700">Full Name
          <input type="text" id="reg-name"
            class="mt-1 w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
            placeholder="John Doe" />
        </label>
        <label class="block text-sm font-medium text-slate-700">Email
          <input type="email" id="reg-email"
            class="mt-1 w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
            placeholder="you@example.com" />
        </label>
        <label class="block text-sm font-medium text-slate-700">Password
          <div class="relative mt-1">
            <input type="password" id="reg-pass"
              class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
              placeholder="Min 6 characters" />
            <button type="button"
              class="pass-toggle absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
              data-target="reg-pass"><i class="fa-solid fa-eye"></i></button>
          </div>
        </label>
        <label class="block text-sm font-medium text-slate-700">Confirm Password
          <div class="relative mt-1">
            <input type="password" id="reg-confirm"
              class="w-full rounded-xl border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-all"
              placeholder="Repeat password" />
            <button type="button"
              class="pass-toggle absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
              data-target="reg-confirm"><i class="fa-solid fa-eye"></i></button>
          </div>
        </label>
        <button id="btn-register"
          class="w-full py-3 rounded-xl bg-primary-600 text-white font-semibold hover:bg-primary-700 transition-all shadow-lg shadow-primary-500/25 active:scale-[0.98]">Create
          Account</button>
        <p class="text-center text-xs text-slate-500">By registering, you agree to our Terms & Privacy Policy.</p>
      </div>
    </div>

    <p class="text-center text-white/70 text-sm mt-6">MyFinance v1.0.0 • PWA Ready</p>
  </div>

  <!-- Toast -->
  <div id="toast"
    class="fixed top-4 right-4 sm:top-auto sm:bottom-6 sm:left-1/2 sm:-translate-x-1/2 -translate-y-4 sm:translate-y-4 opacity-0 pointer-events-none bg-slate-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-xl transition-all duration-300 z-[9999]">
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { initAuth, registerUser, loginUser, googleSignIn } from "./js/auth.js";
    initAuth();

    const tabSignin = document.getElementById('tab-signin');
    const tabRegister = document.getElementById('tab-register');
    const panelSignin = document.getElementById('panel-signin');
    const panelRegister = document.getElementById('panel-register');

    function showTab(tab) {
      if (tab === 'signin') { panelSignin.classList.remove('hidden'); panelRegister.classList.add('hidden'); tabSignin.classList.add('text-primary-700', 'border-b-2', 'border-primary-600', 'bg-primary-50/50'); tabSignin.classList.remove('text-slate-500'); tabRegister.classList.remove('text-primary-700', 'border-b-2', 'border-primary-600', 'bg-primary-50/50'); tabRegister.classList.add('text-slate-500'); }
      else { panelSignin.classList.add('hidden'); panelRegister.classList.remove('hidden'); tabRegister.classList.add('text-primary-700', 'border-b-2', 'border-primary-600', 'bg-primary-50/50'); tabRegister.classList.remove('text-slate-500'); tabSignin.classList.remove('text-primary-700', 'border-b-2', 'border-primary-600', 'bg-primary-50/50'); tabSignin.classList.add('text-slate-500'); }
    }
    tabSignin.addEventListener('click', () => showTab('signin'));
    tabRegister.addEventListener('click', () => showTab('register'));

    function showToast(msg) { const t = document.getElementById('toast'); t.innerHTML = msg; t.classList.add('opacity-100', 'translate-y-0'); t.classList.remove('opacity-0', '-translate-y-4', 'translate-y-4'); setTimeout(() => { t.classList.remove('opacity-100', 'translate-y-0'); t.classList.add('opacity-0', '-translate-y-4'); }, 1800); }
    function showWarn(id, msg) { const el = document.getElementById(id); el.querySelector('span').textContent = msg; el.classList.remove('hidden'); el.classList.add('flex'); }
    function clearWarn(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('flex'); }

    let isSigningIn = false;
    let isRegistering = false;
    let isGoogleSigning = false;

    document.getElementById('btn-register').addEventListener('click', async () => {
      if (isRegistering) return;
      clearWarn('register-warning');
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const confirm = document.getElementById('reg-confirm').value;
      if (!name) { showWarn('register-warning', 'Enter your full name.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showWarn('register-warning', 'Enter a valid email.'); return; }
      if (pass.length < 6) { showWarn('register-warning', 'Password must be at least 6 characters.'); return; }
      if (pass !== confirm) { showWarn('register-warning', 'Passwords do not match.'); return; }

      isRegistering = true;
      const btn = document.getElementById('btn-register');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Creating Account...';

      try {
        await registerUser(name, email, pass);
        showToast('<i class="fa-solid fa-circle-check"></i> Account created! Please sign in.');
        document.getElementById('si-email').value = email;
        document.getElementById('si-pass').value = '';
        showTab('signin');
      } catch (e) {
        showWarn('register-warning', e.message);
      } finally {
        isRegistering = false;
        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        btn.innerHTML = origText;
      }
    });

    document.getElementById('btn-signin').addEventListener('click', async () => {
      if (isSigningIn) return;
      clearWarn('signin-warning');
      const email = document.getElementById('si-email').value.trim();
      const pass = document.getElementById('si-pass').value;
      const remember = document.getElementById('remember-me').checked;
      if (!email || !pass) { showWarn('signin-warning', 'Enter email and password.'); return; }

      isSigningIn = true;
      const btn = document.getElementById('btn-signin');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Signing In...';

      try {
        await loginUser(email, pass, remember);
        showToast('<i class="fa-solid fa-circle-check"></i> Welcome back!');
      } catch (e) {
        showWarn('signin-warning', e.message);
      } finally {
        isSigningIn = false;
        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        btn.innerHTML = origText;
      }
    });

    document.getElementById('btn-google').addEventListener('click', async () => {
      if (isGoogleSigning) return;
      isGoogleSigning = true;
      const btn = document.getElementById('btn-google');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');

      try {
        await googleSignIn();
      } catch (e) {
        showToast('<i class="fa-solid fa-circle-exclamation"></i> ' + e.message);
      } finally {
        isGoogleSigning = false;
        btn.disabled = false;
        btn.classList.remove('opacity-60', 'cursor-not-allowed');
        btn.innerHTML = origText;
      }
    });

    document.getElementById('forgot-link').addEventListener('click', (e) => { e.preventDefault(); showToast('<i class="fa-solid fa-circle-info"></i> Use local demo password reset via re-registration.'); });

    // Password toggles
    document.querySelectorAll('.pass-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (input.type === 'password') { input.type = 'text'; btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>'; }
        else { input.type = 'password'; btn.innerHTML = '<i class="fa-solid fa-eye"></i>'; }
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
